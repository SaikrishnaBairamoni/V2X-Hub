name: Build V2X-Hub Docker Image
on:
  push:
    branches:
      - multiarch-test
  pull_request:

jobs:
  v2xhub-docker:
    # Applied suggested fix: https://github.com/docker/build-push-action/issues/1309
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Confirm submodules present
        run: |
          pwd
          ls -R .src/tmx/Asn_J2735/src/r63 || true          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
          use: true
          ephemeral: false
          driver-opts: |
            image=moby/buildkit:rootless
            network=host
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: usdotfhwaops/v2xhub
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: saikrishnabairamoni/v2xhub:multiarch-test
          labels: ${{ steps.meta.outputs.labels }}
