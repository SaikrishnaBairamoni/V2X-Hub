name: Build V2X-Hub Docker Image
on:
  workflow_dispatch:
  push:
    branches:
      - multiarch-test

jobs:
  build-amd64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64 tag
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: saikrishnabairamoni/v2xhub:amd64

  build-arm64:
    runs-on: [self-hosted, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build arm64 tag
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          no-cache: true
          tags: saikrishnabairamoni/v2xhub:arm64

  manifest:
    runs-on: ubuntu-22.04
    needs: [build-amd64, build-arm64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # Combine the two single-arch tags into a multi-arch manifest
          docker manifest create saikrishnabairamoni/v2xhub:multiarch-test \
            saikrishnabairamoni/v2xhub:amd64 \
            saikrishnabairamoni/v2xhub:arm64

          # Annotate each single-arch image appropriately
          docker manifest annotate saikrishnabairamoni/v2xhub:multiarch-test \
            saikrishnabairamoni/v2xhub:amd64 --arch amd64

          docker manifest annotate saikrishnabairamoni/v2xhub:multiarch-test \
            saikrishnabairamoni/v2xhub:arm64 --arch arm64

          # Push the final multi-arch manifest
          docker manifest push saikrishnabairamoni/v2xhub:multiarch-test
