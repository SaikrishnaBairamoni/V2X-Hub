name: Build Single Multi‐Arch Image Only

on:
  push:
    branches: [ multiarch-test ]
  pull_request:

jobs:
  build-multiarch-single:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          use: true
          ephemeral: false  
          driver-opts: |
            image=moby/buildkit:rootless
            network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build both arches (locally)
        run: |
          # Build AMD64
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --no-cache \
            -t myuser/v2xhub:temp-amd64 \

          # Build ARM64
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --no-cache \
            -t myuser/v2xhub:temp-arm64 \
            .
      - name: Create & push final multi‐arch
        run: |
          docker manifest create myuser/v2xhub:multiarch-only \
            myuser/v2xhub:temp-amd64 \
            myuser/v2xhub:temp-arm64

          docker manifest annotate myuser/v2xhub:multiarch-only \
            myuser/v2xhub:temp-amd64 --arch amd64 --os linux
          docker manifest annotate myuser/v2xhub:multiarch-only \
            myuser/v2xhub:temp-arm64 --arch arm64 --os linux

          docker manifest push myuser/v2xhub:multiarch-only
