name: Build Multi-Arch 
on:
  workflow_dispatch:
  push:
    branches: [ "multiarch-test" ]

jobs:
  build-amd64:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push AMD64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          provenance: false
          tags: saikrishnabairamoni/v2xhub:amd64-ephemeral-${{ github.run_id }}-${{ github.sha }}
    
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          no-cache: true
          provenance: false
          tags: saikrishnabairamoni/v2xhub:arm64-ephemeral-${{ github.run_id }}-${{ github.sha }}

  manifest:
    runs-on: ubuntu-22.04
    needs: [ build-amd64, build-arm64 ]
    steps:
      - name: Log in
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create final multi-arch
        run: |
          AMD64_TAG="saikrishnabairamoni/v2xhub:amd64-ephemeral-${{ github.run_id }}-${{ github.sha }}"
          ARM64_TAG="saikrishnabairamoni/v2xhub:arm64-ephemeral-${{ github.run_id }}-${{ github.sha }}"
          FINAL_TAG="saikrishnabairamoni/v2xhub:multiarch-latest"

          docker manifest create "$FINAL_TAG" \
            "$AMD64_TAG" \
            "$ARM64_TAG"

          docker manifest annotate "$FINAL_TAG" "$AMD64_TAG" --arch amd64
          docker manifest annotate "$FINAL_TAG" "$ARM64_TAG" --arch arm64

          docker manifest push "$FINAL_TAG"
