name: SingleJob-PrivateRegistry

on:
  push:
    branches:
      - multiarch-test

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          use: true
          ephemeral: false
          driver-opts: |
            image=moby/buildkit:rootless
            network=host

      - name: Start local registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2

      - name: Build amd64 -> local registry
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t localhost:5000/v2xhub:amd64-temp \
            .

      - name: Build arm64 -> local registry
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t localhost:5000/v2xhub:arm64-temp \
            .

      - name: Pull them locally to unify
        run: |
          docker pull localhost:5000/v2xhub:amd64-temp
          docker pull localhost:5000/v2xhub:arm64-temp

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag locally for final
        run: |
          docker tag localhost:5000/v2xhub:amd64-temp saikrishnabairamoni/v2xhub:local-amd64
          docker tag localhost:5000/v2xhub:arm64-temp saikrishnabairamoni/v2xhub:local-arm64

      - name: Create + push final multi-arch to Docker Hub
        run: |
          docker manifest create saikrishnabairamoni/v2xhub:multiarch-test \
            saikrishnabairamoni/v2xhub:local-amd64 \
            saikrishnabairamoni/v2xhub:local-arm64
          docker manifest annotate saikrishnabairamoni/v2xhub:multiarch-test \
            saikrishnabairamoni/v2xhub:local-amd64 --arch amd64
          docker manifest annotate saikrishnabairamoni/v2xhub:multiarch-test \
            saikrishnabairamoni/v2xhub:local-arm64 --arch arm64
          docker manifest push saikrishnabairamoni/v2xhub:multiarch-test
